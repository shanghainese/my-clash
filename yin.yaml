# 全局配置 
mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 入站
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.market.xiaomi.com"
    - "time.nwt.com"
    - "time.apple.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://games.shanghainese.uk:8443/dns-query/sze
    - https://games.12161805.xyz:8443/dns-query/sze
    - https://games.14921004.xyz:8443/dns-query/sze
    - https://games.lslnyjq.uk:8443/dns-query/sze
    - https://private.canadianshield.cira.ca/dns-query
 
# 出站策略（精简统一，保留 🚀默认代理、♻️自动选择、🔯故障转移、🌐手动选择、DIRECT）
proxy-groups:
  # 1. 默认代理组
  - {name: 🚀 默认代理, type: select, proxies: [♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  
  # 2. 新建的全局故障转移组（使用 fallback 类型）
  - {name: 🔯 故障转移, type: fallback, include-all: true, interval: 300}

  # 3. 各业务代理组（统一精简）
  - {name: 📹 YouTube, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🍀 Google, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🤖 AI, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 👨🏿‍💻 GitHub, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🐬 OneDrive, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🪟 Microsoft, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🎵 TikTok, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 📲 Telegram, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🎥 NETFLIX, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 💶 Wallet, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🎮 Steam, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  - {name: 🍎 Apple, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}
  
  # 4. 新建的漏网之鱼组
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 默认代理, ♻️ 自动选择, 🔯 故障转移, 🌐 手动选择, DIRECT]}

  # 5. 底层基础节点组
  - {name: ♻️ 自动选择, type: url-test, include-all: true, tolerance: 20, interval: 300, filter: "^((?!(DIRECT)).)*$"}
  - {name: 🌐 手动选择, type: select, include-all: true}

